services:
  db:
    image: postgis/postgis:17-master
    container_name: foodara-db
    environment:
      POSTGRES_DB: foodara
      POSTGRES_USER: foodara
      POSTGRES_PASSWORD: root
    ports:
      - "3309:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "../docs/database foodarav4.sql:/docker-entrypoint-initdb.d/1-schema.sql"
      - "../docs/mock_data.sql:/docker-entrypoint-initdb.d/2-data.sql"
    networks:
      - foodara-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: foodara-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: foodara
      RABBITMQ_DEFAULT_PASS: foodara123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - foodara-network

  notification-db:
    image: postgis/postgis:17-master
    container_name: foodara-notification-db
    environment:
      POSTGRES_DB: foodara_notification
      POSTGRES_USER: foodara
      POSTGRES_PASSWORD: root
    ports:
      - "3310:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    networks:
      - foodara-network

  api-gateway:
    build:
      context: ./Foodara-API-Gateway
      dockerfile: Dockerfile
    container_name: foodara-api-gateway
    depends_on:
      - main-backend
      - driver-service
      - payment-service
      - notification-service
    env_file:
      - ./Foodara-API-Gateway/.env
    environment:
      - MAIN_BACKEND_HOST=main-backend
      - MAIN_BACKEND_PORT=8081
      - DRIVER_SERVICE_HOST=driver-service
      - DRIVER_SERVICE_PORT=8082
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=8083
      - NOTIFICATION_SERVICE_HOST=notification-service
      - NOTIFICATION_SERVICE_PORT=8084
    ports:
      - "8080:8080"
    networks:
      - foodara-network

  main-backend:
    build:
      context: ./Foodara-Backend-Spring-Boot
      dockerfile: Dockerfile
    container_name: foodara-main-backend
    depends_on:
      - db
      - rabbitmq
    env_file:
      - ./Foodara-Backend-Spring-Boot/.env
    environment:
      - POSTGRESQL_DB_IP=db
      - POSTGRESQL_DB_PORT=5432
      - PAYMENT_SERVICE_URL=http://payment-service:8083
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=foodara
      - RABBITMQ_PASS=foodara123
    ports:
      - "8081:8081"
    networks:
      - foodara-network

  payment-service:
    build:
      context: ./Foodara-Payment-Service
      dockerfile: Dockerfile
    container_name: foodara-payment-service
    env_file:
      - ./Foodara-Payment-Service/.env
    environment:
      - MAIN_BACKEND_URL=http://main-backend:8081/api
    ports:
      - "8083:8083"
    networks:
      - foodara-network

  notification-service:
    build:
      context: ./Foodara-Notification-Service
      dockerfile: Dockerfile
    container_name: foodara-notification-service
    depends_on:
      - notification-db
      - rabbitmq
    env_file:
      - ./Foodara-Notification-Service/.env
    environment:
      - NOTIFICATION_DB_HOST=notification-db
      - NOTIFICATION_DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=foodara
      - RABBITMQ_PASS=foodara123
    ports:
      - "8084:8084"
    networks:
      - foodara-network

  driver-service:
    build:
      context: ./Foodara-Driver-Service
      dockerfile: Dockerfile
    container_name: foodara-driver-service
    depends_on:
      - db
    env_file:
      - ./Foodara-Backend-Spring-Boot/.env # Dùng chung cấu hình auth/jwt nếu cần
    environment:
      - POSTGRESQL_DB_IP=db
      - POSTGRESQL_DB_PORT=5432
    ports:
      - "8082:8082"
    networks:
      - foodara-network

  cloudflared:
    image: alpine:3.21
    container_name: foodara-cloudflared
    command: >
      sh -c "
        apk add --no-cache curl jq &&
        wget -qO /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 &&
        chmod +x /tmp/cloudflared &&
        /tmp/cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:20000 --url http://api-gateway:8080 2>&1 | tee /shared/tunnel.log &
        sleep 8 &&
        TUNNEL_URL=$$(grep -oP 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /shared/tunnel.log | head -1) &&
        echo TUNNEL_URL=$$TUNNEL_URL > /shared/tunnel_url.env &&
        echo Tunnel ready: $$TUNNEL_URL &&
        tail -f /dev/null
      "
    depends_on:
      - api-gateway
    networks:
      - foodara-network
    volumes:
      - tunnel_data:/shared

networks:
  foodara-network:
    driver: bridge

volumes:
  pgdata:
  notification_pgdata:
  tunnel_data:
