server.port=8081
server.servlet.context-path=/api

spring.application.name=foodara
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_DB_IP}:${POSTGRESQL_DB_PORT}/foodara?options=-c%20timezone=Asia/Ho_Chi_Minh
spring.datasource.username=${POSTGRESQL_DB_USERNAME}
spring.datasource.password=${POSTGRESQL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=${SPRING_SECURITY_USERNAME:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin123}

# JWT
app.jwt.secret=${JWT_SECRET_KEY:123456789}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Mapbox (Geocoding + Search Box + Directions)
app.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
app.mapbox.geocode-forward-url=${MAPBOX_GEOCODE_FORWARD_URL:https://api.mapbox.com/search/geocode/v6/forward}
app.mapbox.geocode-reverse-url=${MAPBOX_GEOCODE_REVERSE_URL:https://api.mapbox.com/search/geocode/v6/reverse}
app.mapbox.searchbox-suggest-url=${MAPBOX_SEARCHBOX_SUGGEST_URL:https://api.mapbox.com/search/searchbox/v1/suggest}
app.mapbox.searchbox-retrieve-url=${MAPBOX_SEARCHBOX_RETRIEVE_URL:https://api.mapbox.com/search/searchbox/v1/retrieve}
app.mapbox.directions-url=${MAPBOX_DIRECTIONS_URL:https://api.mapbox.com/directions/v5/mapbox}
app.mapbox.country=${MAPBOX_DEFAULT_COUNTRY:vn}
app.mapbox.language=${MAPBOX_DEFAULT_LANGUAGE:vi}
app.mapbox.profile=${MAPBOX_DEFAULT_PROFILE:driving-traffic}
app.mapbox.timeout-ms=${MAPBOX_TIMEOUT_MS:5000}

# Payment Service (Internal)
app.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:foodara}
spring.rabbitmq.password=${RABBITMQ_PASS:foodara123}

# Frontend
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
