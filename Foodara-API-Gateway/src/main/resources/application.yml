server:
  port: 8080

spring:
  application:
    name: foodara-api-gateway

  cloud:
    gateway:
      routes:
        # =============================================
        # Driver Service routes (specific → trước catch-all)
        # =============================================
        - id: driver-service
          uri: http://${DRIVER_SERVICE_HOST:localhost}:${DRIVER_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/driver/**
          filters:
            - StripPrefix=1   # Strip "/api" → forward "/v1/driver/**"

        - id: driver-admin-service
          uri: http://${DRIVER_SERVICE_HOST:localhost}:${DRIVER_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/admin/drivers/**
          filters:
            - StripPrefix=1

        # =============================================
        # Notification Service [FUTURE — uncomment khi deploy]
        # =============================================
        # - id: notification-service
        #   uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8083}
        #   predicates:
        #     - Path=/api/v1/notifications/**
        #   filters:
        #     - StripPrefix=1

        # =============================================
        # Payment Service [FUTURE — uncomment khi deploy]
        # =============================================
        # - id: payment-service
        #   uri: http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8084}
        #   predicates:
        #     - Path=/api/v1/payment/**
        #   filters:
        #     - StripPrefix=1

        # =============================================
        # Main Backend — catch-all (PHẢI để cuối cùng)
        # =============================================
        - id: main-backend
          uri: http://${MAIN_BACKEND_HOST:localhost}:${MAIN_BACKEND_PORT:8081}
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1   # Strip "/api" → forward "/v1/**"

      # Global CORS — thay thế CORS config riêng lẻ trong từng service
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

# JWT Configuration (shared secret with all services)
app:
  jwt:
    secret: ${JWT_SECRET_KEY:123456789}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.db.foodara.gateway: DEBUG
