server.port=8083
server.servlet.context-path=/api
spring.application.name=foodara-payment-service

# SpringDoc Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# SePay Payment Gateway
app.sepay.merchant-id=${SEPAY_MERCHANT_ID:}
app.sepay.secret-key=${SEPAY_SECRET_KEY:}
app.sepay.mode=${SEPAY_MODE:sandbox}

# Main Backend URL for Internal Callbacks
app.main-backend.url=${MAIN_BACKEND_URL:http://localhost:8080}
